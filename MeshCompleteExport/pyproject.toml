# `svmeshcomplete` is installed into Slicer by this module's CMakeLists, and pip-installed
# only for use outside Slicer -- a headless test run, or a workflow packaging a case from a
# terminal. Neither path needs the other: under Slicer the module's own directory is
# already on `sys.path`.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svmeshcomplete"
version = "0.1.0"
description = "Write the mesh-complete folder svMultiPhysics reads from a face-labelled volume mesh"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Aaron Brown" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Pinned to nothing: Slicer ships both, and pinning here would fight whatever the host has.
dependencies = ["numpy", "vtk"]

[project.urls]
Homepage = "https://github.com/SimVascular/SlicerSimVascular"

[tool.setuptools.packages.find]
# The scripted module beside it is not a package, and the tests do not ship.
include = ["svmeshcomplete*"]

[tool.pytest.ini_options]
testpaths = ["Testing/Python"]
