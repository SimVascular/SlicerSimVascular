# `svmpsetup` is installed into Slicer by this module's CMakeLists, and pip-installed only for use
# outside Slicer -- a headless test run, or a workflow writing cases from a terminal. Under Slicer
# the module's own directory is already on `sys.path`.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svmpsetup"
version = "0.1.0"
description = "Write an svMultiPhysics rigid-wall CFD case for a face-labelled vascular model"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Pinned to nothing, as the packages beside the other modules are. svmeshcomplete is beside
# SimVascular Mesh Prep and svromsetup beside SimVascular ROM Simulation, in this repository; the
# boundary conditions are svromsetup's because the two panels share them.
dependencies = ["numpy", "vtk", "svmeshcomplete", "svromsetup"]

[project.urls]
Homepage = "https://github.com/SimVascular/SlicerSimVascular"

[tool.setuptools.packages.find]
include = ["svmpsetup*"]

[tool.pytest.ini_options]
testpaths = ["Testing/Python"]
